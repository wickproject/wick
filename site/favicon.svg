<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wick favicon — radar pulse, matches the unveil_protocol palette. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#101620"/>
      <stop offset="70%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a9f2ff"/>
      <stop offset="60%" stop-color="#6fe3ff"/>
      <stop offset="100%" stop-color="#1d8fb3" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6fe3ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded square so the favicon reads on both light and dark browser chrome -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)"/>

  <!-- Outer ring: thin, dashed — evokes the radar sweep of the nav logo -->
  <circle cx="32" cy="32" r="22"
          fill="none"
          stroke="#6fe3ff"
          stroke-width="1.25"
          stroke-dasharray="2.5 5"
          opacity="0.55"/>

  <!-- Middle ring: solid, slightly brighter -->
  <circle cx="32" cy="32" r="14"
          fill="none"
          stroke="#6fe3ff"
          stroke-width="1.5"
          opacity="0.75"/>

  <!-- Glow halo behind the core -->
  <circle cx="32" cy="32" r="10" fill="url(#glow)"/>

  <!-- Bright cyan core — the "signal acquired" dot -->
  <circle cx="32" cy="32" r="4.5" fill="url(#core)"/>

  <!-- Tiny amber ping at the top-right to hint at the accent palette -->
  <circle cx="47" cy="17" r="1.8" fill="#ffb559" opacity="0.85"/>
</svg>
